<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .Box{
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 80px 80px;
        }

        .red{
            background-color: yellow;
            padding: 90px 90px;
        }

        .blue{
            background-color: blue;
        }
    </style>
</head>
<body>
    <section class="Box">
        <div class="red">1</div>
        <div class="blue">1</div>
    </section>
</body>
</html>
